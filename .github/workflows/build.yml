name: Build for CodeHS

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build the Project
        run: npm run build

      - name: Upload Build Folder
        uses: actions/upload-artifact@v4
        with:
          name: codehs-ready-files
          path: dist/
